; ==========================================================================
;  versoes.ini - versoes do Delphi conhecidas pelos scripts de compilacao
;  (tools\compilar.bat, tools\compilar-expert.bat, tools\gerar-instalador.bat,
;  via tools\versao-delphi.bat). ASCII, uma secao por versao do BDS.
;
;  Formato: chave=valor, SEM espacos em volta do "=". Linhas com ";" sao
;  comentario. Valor vazio = usar o padrao / procurar sozinho.
;
;  Chaves:
;    delphi    numero do Delphi aceito em /delphi:NN (11, 12, 13)
;    nome      texto exibido nas mensagens
;    tag       subpasta das saidas desta versao (lib\<tag>, dcu\<tag>,
;              bin\client\<tag>). Vazio = versao de referencia (Delphi 13):
;              saidas sem subpasta, como sempre foi.
;    pkg       sufixo dos pacotes da RTL/IDE (rtl<pkg>.bpl, designide<pkg>.bpl)
;    jcl_lib   pasta de DCUs da JCL e da JVCL (lib\<jcl_lib>\win32)
;    catalog   pasta CatalogRepository do GetIt (vazio = padrao
;              %USERPROFILE%\Documents\Embarcadero\Studio\<BDS>\CatalogRepository;
;              a variavel de ambiente JVCS_CATALOG tem prioridade)
;    jcl, jvcl, ics, abbrevia
;              pasta raiz da biblioteca: relativa ao CatalogRepository (GetIt)
;              ou caminho absoluto (instalacao fora do GetIt). Se a pasta nao
;              existir, ou nao tiver o arquivo-marcador da biblioteca, o script
;              procura sozinho no CatalogRepository (JEDICodeLibraryJCL*, JCL*,
;              JEDIVisualComponentLibraryJVCL*, JVCL*, ICS_VCL*, ICS*,
;              Abbrevia*), em "<pasta>" e "<pasta>\<versao>"; vale a ultima
;              em ordem alfabetica (a versao mais nova).
;
;  Delphi 11 e 12: os valores de jcl/jvcl/ics/abbrevia abaixo sao PROVAVEIS
;  (as IDEs ainda nao estavam instaladas quando este arquivo foi escrito).
;  Depois de instalar, rode "tools\compilar.bat /delphi:11 /info" e ajuste
;  aqui se a procura automatica nao achar alguma biblioteca.
; ==========================================================================

