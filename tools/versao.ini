; ==========================================================================
;  versao.ini - FONTE UNICA da versao do JEDI VCS 2.5 Beta 2026
;
;  Para subir a versao: edite SO este arquivo e recompile (tools\compilar.bat,
;  tools\compilar-expert.bat, tools\gerar-instalador.bat). O VERSIONINFO de
;  todos os binarios (Jedivcs.exe, JvcsExternalDll.dll, JEDIVCSDiff.exe,
;  jvcs.exe e JvcsExpertBDS<nn>.dll) e o instalador (setup\JediVCS2026.iss,
;  via ReadIni) derivam daqui; tools\gerar-versao.ps1 gera o cabecalho
;  src\common\jvcsversao.rh (fora do git) incluido pelos .rc.
;
;  Mesmo padrao do JEDI VCS original (2.5.0.1030 Beta 3):
;    FILEVERSION    2,5,0,<Build>
;    PRODUCTVERSION 2,5,0,0  (FIXO: o LOGIN envia Maj*100+Min*10+Rel = 250)
;  Regra do Build (doc\pt\common\Versoes.md, "Numeracao de versoes"):
;    beta N               -> 2000 + N*10  (beta 5 = 2050, beta 6 = 2060)
;    correcao da mesma beta -> +1        (2051, 2052, ...)
;    versao final         -> 2100        (Stage=Release)
;
;  Formato: chave=valor, SEM espacos em volta do "=". ASCII.
;    Build        4o campo do FILEVERSION (2000..2999)
;    Stage        Beta ou Release (Release tira a flag VS_FF_PRERELEASE)
;    StageNumber  numero da beta (ignorado em Release)
; ==========================================================================
[Versao]
Build=2060
Stage=Beta
StageNumber=6
